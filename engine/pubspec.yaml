name: logos_engine
description: >-
  The Logos workspace in Flutter: one codebase for Android, iOS, web, Linux, macOS and
  Windows. Contains no scripture text; content arrives through the versioned catalog
  contract in a separate repository.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  drift: ^2.23.0
  drift_flutter: ^0.2.7
  path: ^1.9.0
  path_provider: ^2.1.5
  crypto: ^3.0.7
  archive: ^4.3.0
  sqlite3_flutter_libs: ^0.5.42
  collection: ^1.18.0
  intl: ^0.19.0
  cupertino_icons: ^1.0.8
  sqlite3: ^2.9.4
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  drift_dev: ^2.23.0
  build_runner: ^2.4.13
  mocktail: ^1.0.5

flutter:
  uses-material-design: true

  fonts:
    # Source Sans 3 is the continuation of Source Sans Pro, the reference
    # application's body face. Bundled rather than fetched: the reader has to work
    # with no network, and a runtime font fetch would also delay first paint.
    #
    # SIL Open Font License 1.1, in assets/fonts/OFL.txt.
    - family: SourceSansPro
      fonts:
        - asset: assets/fonts/SourceSans3-Regular.ttf
          weight: 400
        - asset: assets/fonts/SourceSans3-It.ttf
          weight: 400
          style: italic
        - asset: assets/fonts/SourceSans3-Semibold.ttf
          weight: 600
        - asset: assets/fonts/SourceSans3-SemiboldIt.ttf
          weight: 600
          style: italic
        - asset: assets/fonts/SourceSans3-Bold.ttf
          weight: 700
